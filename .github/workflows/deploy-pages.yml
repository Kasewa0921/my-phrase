name: Deploy My Phrase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify phrase library
        run: node scripts/build-phrase-library.cjs --check
      - name: Verify additional workbook phrases
        run: node scripts/build-phrase-additions.cjs --check
      - name: Test conversation logic
        run: node tests/practice.test.cjs
      - name: Build public files
        run: node scripts/build-static.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
