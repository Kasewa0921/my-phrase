<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#ffffff">
  <title>My Phrase</title>
  <style>
    :root {
      color-scheme: only light;
      --bg: #fff; --surface: #fff; --surface-soft: #f4f4f6;
      --ink: #24252a; --muted: #686b74; --line: #dedfe4;
      --brand: #245dcc; --brand-strong: #1949a8; --brand-soft: #eaf0ff;
      --chat-bg: #f4f4f6; --self-bg: #deebff; --self-ink: #253858;
      --rose: #b42336; --success: #247448; --focus: #245dcc55;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; letter-spacing: 0; }
    [hidden] { display: none !important; }
    html { background: var(--bg); }
    body { margin: 0; color: var(--ink); background: var(--bg); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .app { min-height: 100vh; background: var(--surface); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--focus); outline-offset: 4px;
    }
    button { transition: background .18s, color .18s, opacity .18s; }
    button:disabled { cursor: default; opacity: .4; }
    .app-header { border-bottom: 1px solid var(--line); background: var(--surface); box-shadow: none; }
    .header-inner { max-width: 1120px; margin: auto; padding: 20px 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; }
    .brand { font-size: 21px; font-weight: 650; white-space: nowrap; }
    .nav { display: flex; padding: 3px; background: var(--surface-soft); border-radius: 8px; gap: 3px; }
    .nav button { border: 0; background: transparent; color: var(--muted); border-radius: 6px; padding: 9px 24px; font-size: 13px; font-weight: 600; }
    .nav button:hover { color: var(--ink); }
    .nav button.active { color: var(--brand-strong); background: var(--surface); box-shadow: 0 1px 3px #24252a12; }
    .header-actions { display: flex; justify-content: flex-end; }
    .btn { border: 1px solid transparent; border-radius: 8px; min-height: 42px; padding: 10px 20px; color: var(--ink); background: var(--surface-soft); font-size: 14px; font-weight: 500; display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
    .btn:hover:not(:disabled) { background: #e7e8ec; }
    .header-actions .btn { color: var(--brand-strong); background: var(--brand-soft); }
    .header-actions .btn:hover:not(:disabled) { background: var(--self-bg); }
    .btn.primary { background: var(--brand); color: white; }
    .btn.primary:hover:not(:disabled) { background: var(--brand-strong); }
    .btn.ghost { background: transparent; color: var(--brand); padding: 8px 12px; }
    .btn.warn { background: #fff0f1; color: var(--rose); }
    .btn.warn:hover:not(:disabled) { background: #ffe2e6; }
    main { max-width: 1040px; margin: auto; padding: 54px 40px 36px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 34px; }
    .title h2 { font-size: 28px; font-weight: 650; margin: 0; }
    .title p { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
    .view { display: none; }
    .view.active { display: block; animation: appear .22s ease; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    .chat { max-width: 740px; margin: auto; }
    .cheat.active { background: var(--brand-soft); color: var(--brand-strong); }
    #learnView .review-entry .small, #learnView .pattern-meaning, #learnView .pattern-slot, #phrasesView .phrase-ja { display: none; }
    #phrasesView.show-translations .phrase-ja { display: block; }
    .simulation-review { padding: 20px 0; border-top: 1px solid var(--line); }
    .simulation-review summary { font-size: 14px; font-weight: 600; cursor: pointer; }
    .review-entry { padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
    .review-entry .small { color: var(--muted); }
    .reply-option.selected:disabled { opacity: 1; background: var(--self-bg); border-color: #91b2ee; }
    .composer.busy { pointer-events: none; }

    .conversation-tools { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    .conversation-tools .select { max-width: 260px; }
    .conversation-manager { margin-top: 26px; font-size: 13px; color: var(--muted); }
    .conversation-manager summary { cursor: pointer; }
    .dialogue-turn { padding: 24px 0; border-top: 1px solid var(--line); }
    .dialogue-turn .band-head { margin-bottom: 16px; }
    .dialogue-turn h4 { font-size: 14px; margin: 0; font-weight: 600; }
    .conversation-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .assessment { flex-wrap: wrap; }
    .chat-log { height: clamp(320px, 45vh, 480px); overflow-y: auto; overscroll-behavior: contain; padding: 24px 4px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }

    .message { display: flex; align-items: flex-end; gap: 10px; width: 100%; flex-shrink: 0; }
    .message.user { flex-direction: row-reverse; }
    .message-avatar { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; background: #a1cfd1; color: #565b67; display: grid; place-items: center; margin-bottom: 3px; overflow: hidden; }
    .message.user .message-avatar { color: var(--brand); background: var(--self-bg); }
    .message-avatar svg { width: 22px; height: 22px; }
    .message-avatar img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 50%; }
    .message-content { max-width: min(82%, 590px); min-width: 0; }
    .message-label { font-size: 11px; color: var(--muted); margin: 0 6px 5px; }
    .message.user .message-label { text-align: right; }
    .message-line { display: flex; align-items: flex-end; gap: 10px; min-width: 0; }
    .message.user .message-line { justify-content: flex-end; }
    .message.user .message-eye { order: -1; }
    .bubble { --bubble-bg: var(--surface); position: relative; min-width: 0; padding: 15px 19px; background: var(--bubble-bg); color: var(--ink); border-radius: 16px 16px 16px 4px; box-shadow: 0 1px 3px #24252a0a; line-height: 1.65; font-size: 16px; overflow-wrap: anywhere; }
    .bubble::after { content: ""; position: absolute; left: -6px; bottom: 0; width: 8px; height: 10px; background: var(--bubble-bg); clip-path: polygon(100% 0, 0 100%, 100% 100%); }
    .message.user .bubble { --bubble-bg: var(--self-bg); border-radius: 16px 16px 4px 16px; color: var(--self-ink); }
    .message.user .bubble::after { left: auto; right: -6px; clip-path: polygon(0 0, 0 100%, 100% 100%); }
    .message-eye { width: 32px; height: 32px; flex: 0 0 32px; padding: 6px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; margin-bottom: 2px; }
    .message-eye:hover, .message-eye.active { background: var(--self-bg); color: var(--brand-strong); }
    .message-eye svg { display: block; width: 20px; height: 20px; }
    .message-result { text-align: center; font-size: 12px; color: var(--muted); }
    .composer { border-top: 1px solid var(--line); padding-top: 18px; }
    .reply-language { display: flex; justify-content: flex-end; gap: 2px; margin-bottom: 8px; }
    .reply-language button { min-height: 30px; padding: 4px 12px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; }
    .reply-language button[aria-pressed="true"] { border-color: var(--line); background: var(--surface); color: var(--ink); }
    .reply-language button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .reply-options { display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: 1fr; gap: 10px; }
    .reply-option { display: flex; align-items: center; gap: 12px; min-height: 56px; min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); text-align: left; font-size: 14px; line-height: 1.6; }
    .reply-option:hover:not(:disabled) { background: var(--brand-soft); border-color: #91b2ee; }
    .reply-option:active:not(:disabled) { background: var(--self-bg); }
    .option-letter { color: var(--muted); font-size: 12px; flex-shrink: 0; }
    .option-text { overflow-wrap: anywhere; }
    .assessment { display: flex; justify-content: center; gap: 12px; min-height: 70px; padding-top: 10px; align-items: flex-start; }
    .assessment .btn { min-width: 140px; }
    .learning { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 70px; }
    .learning-bars { display: flex; gap: 3px; }
    .learning-bars i { width: 14px; height: 4px; border-radius: 2px; background: var(--line); }
    .learning-bars i.filled { background: var(--brand); }
    .learning.mastered .learning-bars i.filled { background: var(--success); }
    .learning .chip { color: var(--muted); }
    .learning.mastered .chip { color: var(--success); }
    .list-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 22px; }
    .list-heading .small { color: var(--muted); }
    .form-status { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); margin-bottom: 24px; color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .toolbar .field { flex: 1; }
    .toolbar .select { width: 150px; }
    .field, .select, textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 13px; color: var(--ink); background: var(--surface); font-size: 14px; }
    #searchInput { background: var(--surface-soft); border-color: transparent; }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
    textarea { min-height: 100px; resize: vertical; }
    .phrase-list { border-top: 1px solid var(--line); }
    .phrase-row { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 24px 6px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; text-align: left; }
    .phrase-row:hover { background: var(--surface-soft); }
    .phrase-en { font-size: 18px; font-weight: 550; line-height: 1.5; overflow-wrap: anywhere; }
    .phrase-core { color: var(--rose); font-weight: 750; }
    .phrase-variable { color: #24252a; font-weight: 400; }
    .pattern-review { padding: 20px 0; border-top: 1px solid var(--line); line-height: 1.8; }
    .pattern-review h3 { font-size: 14px; margin: 0 0 14px; font-weight: 600; }
    .pattern-item { margin-bottom: 16px; font-size: 14px; overflow-wrap: anywhere; }
    .pattern-item:last-child { margin-bottom: 0; }
    .pattern-meaning, .pattern-example { color: var(--muted); font-size: 12px; }
    .pattern-example { margin-top: 4px; }
    .core-preview { padding: 16px 0; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    .core-preview .phrase-en { margin-bottom: 12px; }
    .phrase-ja { color: var(--muted); font-size: 14px; margin-top: 4px; line-height: 1.7; overflow-wrap: anywhere; }
    .phrase-trailing { display: flex; align-items: center; gap: 20px; color: var(--muted); }
    .phrase-trailing .chevron { font-size: 24px; font-weight: 300; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .chip { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .detail-layout { max-width: 640px; margin: auto; }
    .band { margin-bottom: 24px; }
    .band-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 22px; }
    .band h3 { font-size: 18px; font-weight: 600; margin: 0; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 20px; }
    .form-grid .wide { grid-column: 1 / -1; }
    label { display: grid; gap: 9px; font-size: 13px; font-weight: 500; color: var(--muted); }
    .actions { display: flex; gap: 10px; align-items: center; }
    .form-actions { justify-content: space-between; border-top: 1px solid var(--line); margin-top: 30px; padding-top: 24px; }
    .form-actions .right { display: flex; gap: 10px; }
    .empty { padding: 64px 24px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.8; }
    @keyframes appear { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    @media (max-width: 700px) {
      .header-inner { padding: 16px 20px; grid-template-columns: 1fr auto; gap: 16px; }
      .nav { grid-row: 2; grid-column: 1 / -1; justify-self: stretch; }
      .nav button { flex: 1; }
      .header-actions { grid-row: 1; grid-column: 2; }
      .header-actions .btn { min-height: 36px; padding: 8px 12px; font-size: 12px; }
      .reply-option { padding: 11px; min-height: 56px; gap: 8px; }
      .list-heading { flex-wrap: wrap; }
      main { padding: 32px 22px; }
      .title h2 { font-size: 24px; }
      .topbar { margin-bottom: 26px; }
      .toolbar { flex-wrap: wrap; gap: 8px; }
      .toolbar .field { flex-basis: 100%; }
      .toolbar .select { flex: 1; width: auto; min-width: 120px; }
      .phrase-trailing { gap: 12px; }
      .phrase-row { padding: 20px 0; gap: 10px; }
      .phrase-en { font-size: 16px; }
      .form-grid { grid-template-columns: 1fr; gap: 20px; }
    }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    body.practice-mode { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; background: var(--chat-bg); }
    body.practice-mode .app { height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--chat-bg); }
    body.practice-mode .header-inner { padding: 12px 24px; }
    body.practice-mode main { width: 100%; max-width: 920px; min-height: 0; margin: 0 auto; padding: 14px 20px 18px; }
    body.practice-mode #learnView { height: 100%; min-height: 0; }
    body.practice-mode .chat { display: grid; grid-template-rows: minmax(0, 1fr) auto; height: 100%; min-height: 0; }
    body.practice-mode .chat-log { height: auto; min-height: 0; padding: 16px 4px; gap: 18px; background: var(--chat-bg); scroll-padding-bottom: 14px; scrollbar-width: thin; scrollbar-color: #c9cbd2 transparent; }
    body.practice-mode .composer { padding-top: 12px; border-color: var(--line); }
    body.practice-mode .reply-options { gap: 8px; }
    body.practice-mode .reply-option { min-height: 50px; padding: 10px 14px; line-height: 1.5; }
    @media (max-width: 700px) {
      body.practice-mode .header-inner { padding: 8px 16px; gap: 8px; }
      body.practice-mode .nav button { padding: 7px 18px; }
      body.practice-mode main { padding: 6px 12px 10px; }
      body.practice-mode .chat-log { padding: 10px 2px; gap: 12px; }
      .message { gap: 7px; }
      .message-avatar { width: 28px; height: 28px; flex-basis: 28px; }
      .message-avatar svg { width: 19px; height: 19px; }
      .message-content { max-width: calc(100% - 42px); }
      .bubble { padding: 11px 13px; font-size: 14px; line-height: 1.55; }
      .message-eye { width: 28px; height: 28px; flex-basis: 28px; padding: 5px; }
      .message-eye svg { width: 18px; height: 18px; }
      body.practice-mode .reply-options { gap: 6px; }
      body.practice-mode .reply-option { min-height: 44px; padding: 9px 11px; font-size: 13px; }
      body.practice-mode .composer { padding-top: 9px; }
    }
    @media (max-height: 600px) {
      body.practice-mode .header-inner { padding-top: 5px; padding-bottom: 5px; }
      body.practice-mode main { padding-top: 2px; padding-bottom: 8px; }
      body.practice-mode .chat-log { gap: 9px; padding-top: 6px; padding-bottom: 6px; }
      body.practice-mode .bubble { font-size: 14px; padding: 9px 12px; line-height: 1.45; }
      body.practice-mode .reply-options { gap: 5px; }
      body.practice-mode .reply-option { min-height: 40px; padding-top: 7px; padding-bottom: 7px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { *, .view.active { animation: none; transition: none; } }

  </style>
</head>
<body class="practice-mode">
  <div class="app">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">My Phrase<span style="color:var(--brand)">.</span></div>
        <nav class="nav" aria-label="メイン">
          <button class="active" data-view="learnView" aria-current="page">練習</button>
          <button data-view="phrasesView">フレーズ</button>
        </nav>
        <div class="header-actions">
          <button class="btn" id="quickAddBtn"><span aria-hidden="true">+</span> 会話を追加</button>
        </div>
      </div>
    </header>
    <main>
      <div class="topbar" id="pageHeader" hidden>
        <div class="title">
          <h2 id="pageTitle">会話シミュレーション</h2>
          <p id="pageLead">日常の場面で、会話をしてみよう。</p>
        </div>
      </div>
      <section class="view active" id="learnView" aria-label="会話シミュレーション">
        <div class="chat">
          <div class="chat-log" id="chatLog" role="log" aria-label="練習の会話" aria-live="polite" aria-relevant="additions"></div>
          <div class="composer" id="composer">
            <span class="sr-only" id="replyStatus" role="status" aria-live="polite"></span>
            <div class="reply-language" id="replyLanguage" role="group" aria-label="選択肢の言語">
              <button type="button" id="replyJapaneseBtn" lang="ja" aria-pressed="true">日本語</button>
              <button type="button" id="replyEnglishBtn" lang="en" aria-pressed="false">English</button>
            </div>
            <div class="reply-options" id="replyOptions" role="group" aria-label="あなたの返事"></div>
            <div class="assessment" id="emptyPractice" hidden><button class="btn primary" id="addFromPractice">会話を追加</button></div>
          </div>
        </div>
      </section>
      <section class="view" id="phrasesView" aria-label="フレーズ">
        <div class="list-heading"><span class="small" id="phraseCount"></span><div class="actions"><button class="btn cheat" id="phraseCheatBtn" aria-pressed="false" title="日本語を6秒間表示">カンニング</button><button class="btn primary" id="addFromList"><span aria-hidden="true">+</span> フレーズを追加</button></div></div>
        <div class="toolbar">
          <input class="field" id="searchInput" type="search" placeholder="フレーズを検索" aria-label="フレーズを検索">
          <select class="select" id="categoryFilter" aria-label="単元で絞り込む"></select>
          <select class="select" id="statusFilter" aria-label="学習度で絞り込む">
            <option value="all">すべての学習度</option><option>これから</option><option>練習中</option><option>身についた</option>
          </select>
        </div>
        <div class="phrase-list" id="phraseList"></div>
        <details class="conversation-manager">
          <summary>会話セット</summary>
          <div class="conversation-tools"><select class="select" id="conversationSelect" aria-label="編集する会話"></select><button class="btn ghost" id="editConversationBtn">編集</button></div>
        </details>
        <details class="conversation-manager">
          <summary>会話の振り返り</summary>
          <div id="conversationReviews"></div>
        </details>
      </section>
      <section class="view" id="detailView" aria-label="フレーズ編集">
        <div class="detail-layout">
          <form id="phraseForm">
            <div class="band-head"><h3 id="formTitle">フレーズ追加</h3></div>
            <input type="hidden" id="phraseId">
            <div class="form-status" id="formStatus" hidden><span>学習度</span><span id="formLearning"></span></div>
            <div class="core-preview" id="corePreview" hidden></div>
            <div class="form-grid">
              <label class="wide">英語フレーズ<input class="field" id="englishInput" required placeholder="How's it going?"></label>
              <label class="wide">覚える部分（任意）<input class="field" id="coreInput" placeholder="例：Could I see"></label>
              <label class="wide">日本語の意味<input class="field" id="japaneseInput" required placeholder="調子どう？"></label>
              <label class="wide">単元<select class="select" id="categoryInput"></select></label>
              <label class="wide">使う場面<textarea id="memoInput" placeholder="朝、同僚や友達に会った時。"></textarea></label>
            </div>
            <div class="actions form-actions">
              <button class="btn ghost" type="button" id="deletePhraseBtn" style="color:var(--rose)">削除</button>
              <div class="right"><button class="btn" type="button" id="cancelEditBtn">キャンセル</button><button class="btn primary" type="submit">保存</button></div>
            </div>
          </form>
        </div>
      </section>

      <section class="view" id="conversationView" aria-label="会話セット編集">
        <div class="detail-layout">
          <form id="conversationForm">
            <input type="hidden" id="conversationId">
            <div class="form-grid">
              <label class="wide">会話の名前<input class="field" id="conversationTitleInput" required placeholder="例：カフェで注文"></label>
              <label class="wide">場面<input class="field" id="conversationSceneInput" placeholder="例：朝、いつものカフェで飲み物を注文する。"></label>
              <label class="wide">相手<input class="field" id="conversationRoleInput" placeholder="例：店員" required></label>
            </div>
            <div id="turnEditor"></div>
            <button class="btn ghost" type="button" id="addTurnBtn">+ やり取りを追加</button>
            <div class="form-grid" style="margin-top:24px">
              <label class="wide">相手の最後のひとこと（任意）<input class="field" id="closingEnglishInput" placeholder="Have a nice day!"></label>
              <label class="wide">その日本語訳（任意）<input class="field" id="closingJapaneseInput" placeholder="よい一日を！"></label>
            </div>
            <div class="actions form-actions">
              <button class="btn ghost" type="button" id="deleteConversationBtn" style="color:var(--rose)">削除</button>
              <div class="right"><button class="btn" type="button" id="cancelConversationBtn">キャンセル</button><button class="btn primary" type="submit">会話を保存</button></div>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="phrase-library.js"></script>
  <script src="phrase-additions.js"></script>
  <script src="beginner-dialogues.js"></script>
  <script>

    function findCorePatterns(text, customCore = "") {
      const normalized = (value) => String(value).replace(/[‘’]/g, "'").toLowerCase();
      const source = normalized(text);
      const supplied = !customCore.trim() && getSuppliedExample(text);
      if (supplied) {
        let offset = 0;
        return supplied.parts.flatMap((part) => {

          return !part.variable && /[a-z]/i.test(part.text) ? [{ core: part.text.trim(), meaning: supplied.ja, example: supplied.text, start, end: offset, fixed: true }] : [];
        });

        + (p.example ? '<div class="pattern-example" lang="en">' + formatEnglish(p.example) + '</div>' : "") + '</div>').join("");
    }

    function renderCorePreview() {
      const text = $("#englishInput").value.trim();
      const core = $("#coreInput").value.trim();
      const matches = findCorePatterns(text, core);
      const root = $("#corePreview");
      root.hidden = !matches.length;
      root.innerHTML = '<div class="phrase-en" lang="en">' + formatEnglish(text, core)
        + '</div><div class="pattern-review"><h3>覚える型</h3>' + patternNotes(matches) + '</div>';
    }

    function learningMarkup(phrase) {
      const level = phrase.status === "身についた" ? 3 : phrase.status === "練習中" ? Math.max(1, Math.min(2, phrase.successStreak || 1)) : 0;
      const bars = [1, 2, 3].map((n) => '<i class="' + (n <= level ? "filled" : "") + '"></i>').join("");
      return '<span class="learning ' + (level === 3 ? "mastered" : "") + '"><span class="learning-bars" aria-hidden="true">' + bars + '</span><span class="chip">' + escapeHtml(phrase.status) + '</span></span>';
    }

    function renderPhrases() {
      const q = $("#searchInput").value.trim().toLowerCase();
      const category = $("#categoryFilter").value;
      const status = $("#statusFilter").value;
      const items = phrases.filter((p) => (!q || [p.en, p.ja, p.memo].join(" ").toLowerCase().includes(q))
        && (category === "all" || p.category === category) && (status === "all" || p.status === status));

        list.appendChild(empty);
      }
      items.forEach((p) => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "phrase-row";
        row.innerHTML = '<div><div class="phrase-en" lang="en">' + formatEnglish(p.en, p.core || "") + '</div><div class="phrase-ja">' + escapeHtml(p.ja) + '</div><div class="chips"><span class="chip">' + escapeHtml(p.category) + '</span></div></div><span class="phrase-trailing">' + learningMarkup(p) + '<span class="chevron" aria-hidden="true">›</span></span>';

      $("#coreInput").value = "";
      $("#coreInput").setCustomValidity("");

    function editPhrase(id) {
      const p = phrases.find((item) => item.id === id);
      if (!p) return;
      $("#phraseId").value = p.id;
      $("#formTitle").textContent = "フレーズ編集";
      $("#englishInput").value = p.en;

      $("#japaneseInput").value = p.ja;

    function submitPhrase(event) {
      event.preventDefault();
      const id = $("#phraseId").value;
      const payload = { en: $("#englishInput").value.trim(), ja: $("#japaneseInput").value.trim(), category: $("#categoryInput").value, memo: $("#memoInput").value.trim(), core: $("#coreInput").value.trim() };
      if (!payload.en || !payload.ja) return;
      if (payload.core && !findCorePatterns(payload.en, payload.core).length) {
        $("#coreInput").setCustomValidity("英語フレーズに含まれる部分を指定してください。");
        $("#coreInput").reportValidity();
        return;
      }
      if (id) {
        phrases = phrases.map((p) => {
          if (p.id !== id) return p;
          const changed = p.en !== payload.en || p.ja !== payload.ja;
          return { ...p, ...payload, ...(changed ? { status: "これから", successStreak: 0 } : {}) };
        });
      } else {
        phrases.unshift({ id: makeId(), status: "これから", successStreak: 0, attempts: 0, correct: 0, lastPracticed: "", ...payload });
      }
      fillCategorySelect($("#categoryFilter"), true);
      $("#searchInput").value = "";
      $("#categoryFilter").value = "all";
      $("#statusFilter").value = "all";
      saveAll();
      setView("phrasesView");
    }

    function deleteCurrentPhrase() {
      const id = $("#phraseId").value;
      const p = phrases.find((item) => item.id === id);
      if (!p || !confirm("「" + p.en + "」を削除しますか？")) return;
      phrases = phrases.filter((item) => item.id !== id);
      saveAll();
      setView("phrasesView");
    }


    function loadConversations() {
      const saved = localStorage.getItem(CONVERSATIONS_KEY);
      let items = saved ? JSON.parse(saved) : [...seedConversations, ...topicConversations];
      if (items.length && !localStorage.getItem(TOPIC_LIBRARY_KEY)) {
        const ids = new Set(items.map((c) => c.id));
        items = [...items, ...topicConversations.filter((c) => !ids.has(c.id))];
        items = items.map((c) => ({ successStreak: 0, attempts: 0, status: "これから", ...c }));
        localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(items));
        localStorage.setItem(TOPIC_LIBRARY_KEY, "1");
      }
      if (suppliedConversations.length && !localStorage.getItem(SUPPLIED_LIBRARY_KEY)) {
        const ids = new Set(items.map((c) => c.id));
        if (items.length) items = [...items, ...suppliedConversations.filter((c) => !ids.has(c.id))];
        localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(items));
        localStorage.setItem(SUPPLIED_LIBRARY_KEY, "1");
      }
      let migrated = false;
      items = items.map((c) => {
        const original = legacyTopicConversations.find((topic) => topic.id === c.id);
        const beginner = topicConversations.find((topic) => topic.id === c.id);
        if (original && beginner && sameConversationContent(c, original)) {
          migrated = true;
          return { ...c, ...beginner, attempts: c.attempts || 0, successStreak: c.successStreak || 0, status: c.status || "これから" };
        }
        return c;
      });
      if (saved && migrated) localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(items));
      return items.map((c) => ({ successStreak: 0, attempts: 0, status: "これから", ...c }));
    }

    function sameConversationContent(a, b) {
      return ["title", "scene", "role", "closingEn", "closingJa", "turns"].every((key) => JSON.stringify(a[key]) === JSON.stringify(b[key]));
    }

    function isBuiltInConversation(c) {
      return [...seedConversations, ...topicConversations, ...suppliedConversations].some((original) => c.id === original.id && sameConversationContent(c, original));
    }

    function pickStartConversation() {
      const lastId = localStorage.getItem(LAST_START_KEY);
      const pool = practiceConversations();
      const fresh = pool.filter((c) => c.id !== lastId);
      return shuffle(fresh.length ? fresh : pool)[0]?.id;
    }

    function buildBaseSimulation(c) {
      const nodes = {};
      c.turns.forEach((turn, index) => {
        const next = index + 1 < c.turns.length ? "turn" + (index + 1) : null;

        };
      });
      const seed = seedConversations.find((item) => item.id === c.id);

    function teacherStory(en, ja, detailEn, detailJa, tone = "positive") {
      return { en, ja, detailEn, detailJa, tone };
    }

    const recentTeacherLines = [];

    function pickTeacherLine(lines) {
      const fresh = lines.filter((line) => !recentTeacherLines.slice(-3).includes(line.en));
      const line = shuffle(fresh.length ? fresh : lines)[0];
      recentTeacherLines.push(line.en);
      if (recentTeacherLines.length > 12) recentTeacherLines.shift();
      return line;
    }

    function practiceConversations() {
      return conversations.filter((c) => !isBuiltInConversation(c) || reviewedDialogues[c.id]);
    }

    function setTeacherStory(node, story, next, receipt = null) {
      node.story = story;
      node.resumeNext = next;
      node.partnerEn = (receipt ? receipt.en + " " : "") + story.en;
      node.partnerJa = (receipt ? receipt.ja + " " : "") + story.ja;
      node.simplePartnerEn = story.detailEn || story.en;
      node.simplePartnerJa = story.detailJa || story.ja;
      const replies = story.tone === "tough" ? [
        ["I see.", "そうなんだ。"],
        ["That sounds hard.", "それは大変そうだね。", ["Thanks.", "ありがとう。"]],
        ["I'm sorry to hear that.", "それは大変だね。", ["Thanks.", "ありがとう。"]]
      ] : story.tone === "neutral" ? [
        ["I see.", "そうなんだ。"],
        ["Oh, okay.", "ああ、わかった。"],
        ["That's interesting.", "それは興味深いね。"]
      ] : [
        ["I see.", "そうなんだ。"],
        ["That sounds nice.", "それはいいね。"],
        ["That's interesting.", "それは興味深いね。"]
      ];
      node.choices = replies.map(([text, ja, receipt]) => response(text, ja, next, "", {
        core: text, reactionEn: receipt?.[0], reactionJa: receipt?.[1]
      }));
      // A detail is a one-time follow-up, not another copy of the same answer.
      node.questions = story.isDetail || !story.detailEn ? [] : [
        response("Can you tell me more about that?", "もう少し詳しく教えてくれる？", node.id, "", {
          core: "Can you tell me more about",
          action: "ask",
          stories: [{ ...story, en: story.detailEn, ja: story.detailJa, tone: "neutral", isDetail: true }]
        })
      ];
    }

    function buildSimulation(c) {
      const turns = isBuiltInConversation(c) && reviewedDialogues[c.id];
      if (!turns) return buildBaseSimulation(c);
      const nodes = {};
      turns.forEach((turn, index) => {
        const id = "turn" + index;
        const next = index + 1 < turns.length ? "turn" + (index + 1) : null;
        const reactionId = "reaction-" + id;
        const answer = teacherStory(...turn.teacher, turn.tone || "positive");
        nodes[id] = {
          kind: "conversation", reviewed: true,
          partnerEn: turn.prompt[0], partnerJa: turn.prompt[1],
          simplePartnerEn: turn.explain[0], simplePartnerJa: turn.explain[1],
          openings: index === 0 ? [turn.prompt, ...turn.openings] : [],
          teacherAnswer: answer, reactionId,
          choices: turn.replies.map(([text, ja, core, receipt]) => response(text, ja, next, "", {
            core, reactionEn: receipt[0], reactionJa: receipt[1]
          })),
          questions: [response("What about you?", "先生はどう？", reactionId, "", {
            core: "What about you", action: "ask", stories: [answer]
          })]
        };
        const reaction = { id: reactionId, kind: "reaction", reviewed: true };
        setTeacherStory(reaction, answer, next);
        nodes[reactionId] = reaction;
      });
      return nodes;
    }

    function teacherReceipt(option, node) {
      if (!node.reviewed || node.kind !== "conversation" || !option.reactionEn) return null;
      return { en: option.reactionEn, ja: option.reactionJa };
    }

    function recordPracticeReply(option) {
      const remembered = !practice.repaired;
      practice.results.push(remembered);
      const p = phrases.find((item) => [option.text, option.sourceText].filter(Boolean).some((text) => item.en.trim().toLowerCase() === text.trim().toLowerCase()));
      if (!p) return;
      p.attempts = (p.attempts || 0) + 1;
      p.correct = (p.correct || 0) + (remembered ? 1 : 0);
      p.successStreak = remembered ? Math.min(3, p.successStreak + 1) : 0;
      p.status = p.successStreak >= 3 ? "身についた" : p.successStreak ? "練習中" : "これから";
      p.lastPracticed = new Date().toLocaleDateString("sv-SE");
      saveAll();
    }



    function hideMessageTranslation(node) {
      const hint = messageHints.get(node);
      if (!hint) return;
      window.clearTimeout(hint.timer);
      hint.body.innerHTML = hint.englishHtml;
      hint.body.setAttribute("lang", "en");
      hint.eye.classList.remove("active");
      hint.eye.innerHTML = ICON_EYE;
      hint.eye.title = "このセリフの日本語を6秒間表示";
      hint.eye.setAttribute("aria-label", "このセリフの日本語を表示");
      hint.eye.setAttribute("aria-pressed", "false");
      messageHints.delete(node);
      scrollChat();
    }

    function showMessageTranslation(node, body, translation, eye) {
      if (messageHints.has(node)) return hideMessageTranslation(node);
      hideTranslations();
      const englishHtml = body.innerHTML;
      body.innerHTML = escapeHtml(translation);
      body.setAttribute("lang", "ja");
      eye.classList.add("active");
      eye.innerHTML = ICON_EYE_OFF;
      eye.title = "英語に戻す";
      eye.setAttribute("aria-label", "このセリフを英語に戻す");
      eye.setAttribute("aria-pressed", "true");
      const timer = window.setTimeout(() => hideMessageTranslation(node), 6000);
      messageHints.set(node, { timer, body, englishHtml, eye });
      scrollChat();
    }

    function hideTranslations() {
      if (cheatTimer !== null) window.clearTimeout(cheatTimer);
      cheatTimer = null;
      for (const node of Array.from(messageHints.keys())) hideMessageTranslation(node);
      $("#phrasesView").classList.remove("show-translations");
      $("#phraseCheatBtn").classList.remove("active");
      $("#phraseCheatBtn").setAttribute("aria-pressed", "false");
      $("#phraseCheatBtn").textContent = "カンニング";
    }

    function showPhraseTranslations() {
      if ($("#phrasesView").classList.contains("show-translations")) return hideTranslations();
      hideTranslations();
      $("#phrasesView").classList.add("show-translations");
      $("#phraseCheatBtn").classList.add("active");
      $("#phraseCheatBtn").setAttribute("aria-pressed", "true");
      $("#phraseCheatBtn").textContent = "日本語を隠す";
      cheatTimer = window.setTimeout(hideTranslations, 6000);
    }

    function pickNextTopic(current) {
      const pool = practiceConversations().filter((c) => c.id !== current.id);
      if (!pool.length) return current.id;
      const recent = new Set(recentTopics.slice(-3));
      const fresh = pool.filter((c) => !recent.has(c.id));
      const eligible = fresh.length ? fresh : pool;
      const ids = new Set(eligible.map((c) => c.id));
      topicQueue = topicQueue.filter((id) => ids.has(id));
      if (!topicQueue.length) topicQueue = shuffle(eligible.map((c) => c.id));
      const id = shuffle(topicQueue)[0];
      topicQueue = topicQueue.filter((item) => item !== id);
      return id;
    }

    function topicBridge(previous, next) {
      const bridges = {
        "topic-food": ["Let's talk about food.", "食べ物の話をしよう。"],
        "source-scene-home-cooking": ["How about talking about cooking?", "料理の話はどう？"],
        "topic-work": ["Let's talk about work for a moment.", "少し仕事の話をしよう。"],
        "topic-weekend": ["Let's talk about this weekend.", "今週末の話をしよう。"],
        "source-scene-last-weekend": ["How about talking about last weekend?", "先週末の話はどう？"],
        "topic-hobbies": ["Let's talk about hobbies.", "趣味の話をしよう。"],
        "topic-movies": ["How about talking about movies?", "映画の話はどう？"],
        "topic-travel": ["Let's talk about travel.", "旅行の話をしよう。"],
        "topic-weather": ["How about talking about the weather?", "天気の話はどう？"],
        "topic-shopping": ["Let's talk about shopping.", "買い物の話をしよう。"],
        "topic-exercise": ["How about talking about exercise?", "運動の話はどう？"],
        "source-scene-english-goals": ["Let's talk about learning English.", "英語の勉強の話をしよう。"]
      };
      return bridges[next.id] || ["Can I ask you something else?", "別のことも聞いていい？"];
    }

    function acknowledgeEnding(c, ending) {
      const endings = {
        "No problem. Maybe another time!": ["No problem. We can plan for another time.", "大丈夫。また別の機会に予定を立てよう。"],
        "Sure! One o'clock works for me. See you then!": ["Sure! One o'clock works for me.", "もちろん！1時で大丈夫だよ。"],
        "That works too. Let's meet there at noon.": ["That works too. Let's meet there at noon.", "そっちでもいいね。12時にそこで会おう。"],
        "Great. See you at four!": ["Great. Four o'clock it is.", "いいね。じゃあ4時にしよう。"],
        "Sure. Four o'clock at the west exit. See you!": ["Sure. Four o'clock at the west exit.", "いいよ。4時に西口でね。"],
        "No worries. Let's meet another day.": ["No worries. We can work out another day.", "大丈夫。また別の日を相談しよう。"],
        "Yes, the east exit at three. See you!": ["Yes, the east exit at three.", "うん、3時に東口で。"],
        "Sure. Let's meet at the west exit at three.": ["Sure. Let's meet at the west exit at three.", "いいよ。3時に西口で会おう。"]
      };
      const message = endings[ending.closingEn];
      if (message) appendMessage("partner", message[0], message[1]);
      else if (c.id === "cafe" && !ending.reactionEn) appendMessage("partner", "That'll be four dollars.", "4ドルです。");
      else if (!c.continuousTopic && !seedConversations.some((seed) => seed.id === c.id) && c.closingEn) {
        appendMessage("partner", ending.closingEn || c.closingEn, ending.closingJa || c.closingJa);
      }
    }

    function startConversation(id, keepHistory = false) {
      hideTranslations();
      if (responseTimer !== null) window.clearTimeout(responseTimer);
      responseTimer = null;
      runVersion += 1;
      const previous = currentConversation();
      const previousRole = practice.partnerRole || previous?.role;
      const pool = practiceConversations();
      const c = pool.find((item) => item.id === id) || pool.find((item) => item.id === pickStartConversation());
      practice = { conversationId: c?.id || null, partnerRole: keepHistory ? previousRole || c?.role : c?.role, nodeId: "turn0", waiting: false, completed: false, results: [], log: [], repaired: false, options: [], answersSinceShare: 0, teacherStoryCount: 0 };
      if (c) {
        if (!keepHistory) localStorage.setItem(LAST_START_KEY, c.id);
        recentTopics.push(c.id);
        if (recentTopics.length > 12) recentTopics.shift();
        topicQueue = topicQueue.filter((topicId) => topicId !== c.id);
      }
      $("#composer").classList.remove("busy");
      if (!keepHistory) $("#chatLog").innerHTML = "";
      renderConversationSelect();
      $("#pageLead").textContent = c?.scene || pageCopy.learnView[1];
      $("#replyStatus").textContent = c ? "あなたの番" : "会話を選ぼう";
      if (!c) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "練習したい会話を追加しよう。";
        $("#chatLog").appendChild(empty);
          setReplyMode("empty");
        return;
      }
      simulationNodes = buildSimulation(c);
      if (simulationNodes.turn0 && isBuiltInConversation(c)) {
        const variants = simulationNodes.turn0.openings || c.openings || openingVariants[c.id] || [];
        const lastOpening = openingHistory.get(c.id);
        const fresh = variants.filter(([en]) => en !== lastOpening);
        const opening = shuffle(fresh.length ? fresh : variants)[0];
        if (opening) {
          if (!simulationNodes.turn0.reviewed) {
            simulationNodes.turn0.simplePartnerEn = simulationNodes.turn0.partnerEn;
            simulationNodes.turn0.simplePartnerJa = simulationNodes.turn0.partnerJa;
          }
          [simulationNodes.turn0.partnerEn, simulationNodes.turn0.partnerJa] = opening;
          openingHistory.set(c.id, opening[0]);
        }
      }
      if (keepHistory && simulationNodes.turn0) {
        const [en, ja] = topicBridge(previous, c);
        appendMessage("partner", en, ja);
      }
      showTurn();
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }


    function buildOptions(node) {
      const normalize = (text) => text.trim().toLowerCase().replace(/[.!?]+$/g, "");
      const seen = new Set();
      const replies = node.choices.map(prepareLearningReply).filter((reply) => {
        const key = normalize(reply.text);
        if (seen.has(key) || !findCorePatterns(reply.text, reply.core || "").length) return false;
        seen.add(key);
        return true;
      });
      const helpers = commonReplies.filter((reply) => !seen.has(normalize(reply.text))
        && (!node.reviewed || ["Could you say that again?", "What do you mean?", "Could we talk about something else?", ...(node.kind === "conversation" ? ["Let me think."] : [])].includes(reply.text))
        && !(node.reviewed && node.story?.isDetail && reply.action === "explain"))
        .map((reply) => ({ ...reply, next: practice.nodeId }));
      const questions = (node.questions || []).map(prepareLearningReply).filter((reply) => !seen.has(normalize(reply.text)) && findCorePatterns(reply.text, reply.core || "").length);
      // Sample content before shuffling positions; no reply owns a fixed slot.
      const count = Math.min(replies.length, questions.length ? 2 : Math.random() < 0.5 ? 2 : 3);
      const question = shuffle(questions).slice(0, 1);
      const options = [...shuffle(replies).slice(0, count), ...question, ...shuffle(helpers).slice(0, 4 - count - question.length)];
      const key = practice.conversationId + ":" + practice.nodeId;
      const previous = optionHistory.get(key);
      const signature = (items) => items.map((reply) => normalize(reply.text)).sort().join("|");
      if (previous?.content === signature(options)) {
        const used = new Set(options.map((reply) => normalize(reply.text)));
        const freshReply = shuffle(replies).find((reply) => !used.has(normalize(reply.text)));
        const freshHelper = shuffle(helpers).find((reply) => !used.has(normalize(reply.text)));
        if (freshReply && count) options[count - 1] = freshReply;
        else if (freshHelper) options[options.length - 1] = freshHelper;
      }
      const result = shuffle(options);
      const order = (items) => items.map((reply) => normalize(reply.text)).join("|");
      if (previous?.order === order(result) && result.length > 1) {
        const index = 1 + Math.floor(Math.random() * (result.length - 1));
        [result[0], result[index]] = [result[index], result[0]];
      }
      optionHistory.set(key, { content: signature(result), order: order(result) });
      if (optionHistory.size > 200) optionHistory.delete(optionHistory.keys().next().value);
      return result;
    }

    function renderOptions(node) {
      practice.options = buildOptions(node);
      paintReplyOptions();
      setReplyMode("reply");
    }

    function setReplyLanguage(language) {
      if (!["ja", "en"].includes(language) || practice.waiting || practice.completed) return;
      replyLanguage = language;
      localStorage.setItem(REPLY_LANGUAGE_KEY, language);
      paintReplyOptions();
    }

    function paintReplyOptions() {
      $("#replyJapaneseBtn").setAttribute("aria-pressed", String(replyLanguage === "ja"));
      $("#replyEnglishBtn").setAttribute("aria-pressed", String(replyLanguage === "en"));
      const root = $("#replyOptions");
      root.innerHTML = "";
      practice.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "reply-option";
        const japanese = replyLanguage === "ja" && !!option.ja?.trim();
        const text = japanese ? escapeHtml(option.ja) : formatEnglish(option.text, option.core || "");
        button.innerHTML = '<span class="option-letter" aria-hidden="true">' + "ABCD"[index]
          + '</span><span class="option-text" lang="' + (japanese ? "ja" : "en") + '">' + text
          + '</span>';
        button.addEventListener("click", () => chooseReply(index, button));
        root.appendChild(button);
      });
    }

    function showTurn() {
      hideTranslations();
      const node = simulationNodes[practice.nodeId];
      if (!node) return finishConversation();
      practice.waiting = false;
      practice.repaired = false;
      $("#replyStatus").textContent = "あなたの番";
      appendMessage("partner", node.partnerEn, node.partnerJa);
      renderOptions(node);
    }

    function chooseReply(index, button) {
      const c = currentConversation();
      if (!c || practice.waiting || practice.completed || button.disabled) return;
      const node = simulationNodes[practice.nodeId];
      const option = practice.options[index];
      if (!node || !option) return;
      hideTranslations();
      practice.waiting = true;
      button.classList.add("selected");
      Array.from($("#replyOptions").children).forEach((item) => { item.disabled = true; });
      $("#composer").classList.add("busy");
      $("#replyStatus").textContent = "返事を考えています…";
      appendMessage("user", option.text, option.ja, option.core || "");
      practice.log.push({ partner: node.partnerEn, text: option.text, core: option.core || "", ja: option.ja, mismatch: !!option.mismatch, note: option.note || "" });
      if (practice.log.length > 100) practice.log.shift();
      const version = runVersion;
      responseTimer = window.setTimeout(() => {
        responseTimer = null;
        if (version !== runVersion) return;
        $("#composer").classList.remove("busy");
        if (option.action) {
          practice.waiting = false;
          if (option.action === "ask") {
            recordPracticeReply(option);
            const reaction = simulationNodes[option.next];
            const story = pickTeacherLine(option.stories);
            setTeacherStory(reaction, story, reaction.resumeNext);
            practice.answersSinceShare = 0;
            practice.teacherStoryCount = (practice.teacherStoryCount || 0) + 1;
            practice.nodeId = option.next;
            showTurn();
            return;
          } else if (option.action === "repeat") {
            practice.repaired = true;
            appendMessage("partner", node.partnerEn, node.partnerJa);
          } else if (option.action === "explain") {
            practice.repaired = true;
            appendMessage("partner", node.simplePartnerEn || node.partnerEn, node.simplePartnerJa || node.partnerJa);
          } else {
            appendMessage("partner", option.reactionEn, option.reactionJa);
          }
          if (option.action === "skip") {
            practice.results.push(false);
            finishConversation({ skip: true });
          } else {
            $("#replyStatus").textContent = "あなたの番";
            renderOptions(node);
          }
          return;
        }
        if (option.mismatch) {
          practice.repaired = true;
          practice.waiting = false;
          appendMessage("partner", "Sorry, what do you mean?", "ごめん、どういう意味？");
          $("#replyStatus").textContent = "相手が聞き返しています";
          renderOptions(node);
          return;
        }
        recordPracticeReply(option);
        const receipt = teacherReceipt(option, node);
        if (node.kind === "conversation" && node.reviewed) {
          const reaction = simulationNodes[node.reactionId];
          setTeacherStory(reaction, node.teacherAnswer, option.next, receipt);
          reaction.pendingEnding = option.next === null ? option : null;
          practice.answersSinceShare = 0;
          practice.teacherStoryCount = (practice.teacherStoryCount || 0) + 1;
          practice.nodeId = node.reactionId;
          practice.waiting = false;
          showTurn();
          return;
        }
        if (option.reactionEn) appendMessage("partner", option.reactionEn, option.reactionJa);
        else if (receipt) appendMessage("partner", receipt.en, receipt.ja);
        practice.waiting = false;
        practice.nodeId = option.next;
        if (option.next === null) finishConversation(node.pendingEnding || option);
        else showTurn();
      }, 700);
    }

    function finishConversation(ending = {}) {
      if (practice.completed) return;
      const c = currentConversation();
      if (!c) return;
      practice.completed = true;
      practice.waiting = false;
      c.attempts += 1;
      c.successStreak = practice.results.every(Boolean) ? Math.min(3, c.successStreak + 1) : 0;
      c.status = c.successStreak >= 3 ? "身についた" : c.successStreak ? "練習中" : "これから";
      const nextId = pickNextTopic(c);
      if (!ending.skip) acknowledgeEnding(c, ending);
      $("#replyStatus").textContent = "会話を続けています…";
      const review = document.createElement("details");
      review.className = "simulation-review";
      const entries = practice.log.map((item) => '<div class="review-entry"><div lang="en">' + formatEnglish(item.text, item.core || "")
        + '</div><div class="small">' + escapeHtml(item.ja || "") + '</div>'
        + (item.mismatch ? '<div class="small">この場面では意図が伝わらず、相手が聞き返しました。</div>' : item.note ? '<div class="small">' + escapeHtml(item.note) + '</div>' : "") + '</div>').join("");
      const patterns = practice.log.flatMap((item) => findCorePatterns(item.text, item.core || ""));
      review.innerHTML = '<summary>' + escapeHtml(c.title) + '</summary>' + entries
        + (patterns.length ? '<div class="pattern-review"><h3>覚える型</h3>' + patternNotes(patterns) + '</div>' : "");
      completedReviews.unshift(review);
      completedReviews = completedReviews.slice(0, 12);
      const history = $("#conversationReviews");
      history.innerHTML = "";
      completedReviews.forEach((item) => history.appendChild(item));
      setReplyMode("reply");
      hideTranslations();
      saveAll();
      scrollChat();
      const version = runVersion;
      responseTimer = window.setTimeout(() => {
        responseTimer = null;
        if (version === runVersion) startConversation(nextId, true);
      }, 650);
    }

    function editableConversationTurns(c) {
      if (!isBuiltInConversation(c) || !reviewedDialogues[c.id]) return c.turns.map((t) => ({ ...t }));
      const nodes = buildSimulation(c);
      return Object.values(nodes).map((node) => {
        const [first, ...alternatives] = node.choices.map(({ text, ja, core, reactionEn, reactionJa }) => ({ text, ja, core, reactionEn, reactionJa }));
        return { partnerEn: node.partnerEn, partnerJa: node.partnerJa,
          replyEn: first.text, replyJa: first.ja, core: first.core,
          reactionEn: first.reactionEn, reactionJa: first.reactionJa, alternatives };
      });
    }

    function openConversationEditor(id) {
      const c = conversations.find((item) => item.id === id);
      $("#conversationId").value = c?.id || "";
      $("#conversationTitleInput").value = c?.title || "";
      $("#conversationSceneInput").value = c?.scene || "";
      $("#conversationRoleInput").value = c?.role || "相手";
      $("#closingEnglishInput").value = c?.closingEn || "";
      $("#closingJapaneseInput").value = c?.closingJa || "";
      $("#deleteConversationBtn").hidden = !c;
      conversationDraft = c ? editableConversationTurns(c) : [{ partnerEn: "", partnerJa: "", replyEn: "", replyJa: "" }];
      renderTurnEditor();
      setView("conversationView");
      $("#conversationTitleInput").focus();
    }

    function renderTurnEditor() {
      const root = $("#turnEditor");
      root.innerHTML = "";
      conversationDraft.forEach((turn, index) => {
        const row = document.createElement("div");
        row.className = "dialogue-turn";
        const heading = document.createElement("div");
        heading.className = "band-head";
        const title = document.createElement("h4");
        title.textContent = "やり取り " + (index + 1);
        heading.appendChild(title);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "btn ghost";
        remove.textContent = "×";
        remove.title = "このやり取りを削除";
        remove.setAttribute("aria-label", "やり取り " + (index + 1) + " を削除");
        remove.disabled = conversationDraft.length === 1;
        remove.addEventListener("click", () => { conversationDraft.splice(index, 1); renderTurnEditor(); });
        heading.appendChild(remove);
        row.appendChild(heading);
        const grid = document.createElement("div");
        grid.className = "form-grid";
        [["partnerEn", "相手の言葉（英語）"], ["partnerJa", "相手の言葉（日本語）"], ["replyEn", "自分の返事（英語）"], ["replyJa", "自分の返事（日本語）"]].forEach(([key, text]) => {
          const label = document.createElement("label");
          label.textContent = text;
          const input = document.createElement("input");
          input.className = "field";
          input.value = turn[key] || "";
          input.required = key !== "partnerJa";
          input.addEventListener("input", () => { turn[key] = input.value; });
          label.appendChild(input);
          grid.appendChild(label);
        });
        row.appendChild(grid);
        root.appendChild(row);
      });
    }

    function submitConversation(event) {
      event.preventDefault();
      const id = $("#conversationId").value;
      const turns = conversationDraft.map((t) => ({ ...t, ...Object.fromEntries(["partnerEn", "partnerJa", "replyEn", "replyJa"].map((k) => [k, (t[k] || "").trim()])) }));
      const payload = {
        title: $("#conversationTitleInput").value.trim(), scene: $("#conversationSceneInput").value.trim(),
        role: $("#conversationRoleInput").value.trim(), turns,
        closingEn: $("#closingEnglishInput").value.trim(), closingJa: $("#closingJapaneseInput").value.trim()
      };
      if (!payload.title || !payload.role || !turns.length || turns.some((t) => !t.partnerEn || !t.replyEn || !t.replyJa)) return;
      const existing = conversations.find((c) => c.id === id);
      const contentChanged = existing && JSON.stringify(existing.turns) !== JSON.stringify(turns);
      const c = { attempts: 0, successStreak: 0, status: "これから", ...existing, ...payload, id: id || makeId() };
      if (contentChanged) { c.successStreak = 0; c.status = "これから"; }
      if (id) conversations = conversations.map((item) => item.id === id ? c : item);
      else conversations.push(c);
      saveAll();
      startConversation(c.id);
      setView("learnView");
    }

    function deleteConversation() {
      const id = $("#conversationId").value;
      const c = conversations.find((item) => item.id === id);
      if (!c || !confirm("「" + c.title + "」の会話を削除しますか？")) return;
      conversations = conversations.filter((item) => item.id !== id);
      saveAll();
      startConversation(practice.conversationId === id ? pickStartConversation() : practice.conversationId);
      setView("learnView");
    }

    function bindEvents() {
      $("#replyJapaneseBtn").addEventListener("click", () => setReplyLanguage("ja"));
      $("#replyEnglishBtn").addEventListener("click", () => setReplyLanguage("en"));
      $$(".nav button").forEach((button) => button.addEventListener("click", () => setView(button.dataset.view)));
      ["#addFromList"].forEach((id) => $(id).addEventListener("click", openAdd));
      ["#quickAddBtn", "#addFromPractice"].forEach((id) => $(id).addEventListener("click", () => openConversationEditor()));
      $("#conversationSelect").addEventListener("change", () => startConversation($("#conversationSelect").value));
      $("#editConversationBtn").addEventListener("click", () => openConversationEditor(practice.conversationId));
      $("#phraseCheatBtn").addEventListener("click", showPhraseTranslations);
      $("#cancelConversationBtn").addEventListener("click", () => setView("learnView"));
      $("#conversationForm").addEventListener("submit", submitConversation);
      $("#deleteConversationBtn").addEventListener("click", deleteConversation);
      $("#addTurnBtn").addEventListener("click", () => {
        conversationDraft.push({ partnerEn: "", partnerJa: "", replyEn: "", replyJa: "" });
        renderTurnEditor();
      });
      $("#cancelEditBtn").addEventListener("click", () => setView("phrasesView"));
      $("#phraseForm").addEventListener("submit", submitPhrase);
      ["#englishInput", "#coreInput"].forEach((id) => $(id).addEventListener("input", () => {
        $("#coreInput").setCustomValidity("");
        renderCorePreview();
      }));
      $("#deletePhraseBtn").addEventListener("click", deleteCurrentPhrase);
      $("#searchInput").addEventListener("input", renderPhrases);
      $("#categoryFilter").addEventListener("change", renderPhrases);
      $("#statusFilter").addEventListener("change", renderPhrases);
    }

    function init() {
      fillCategorySelect($("#categoryFilter"), true);
      fillCategorySelect($("#categoryInput"));
      bindEvents();
      renderPhrases();
      startConversation(pickStartConversation());
    }
    init();

  </script>
